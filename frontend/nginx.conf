server {
    listen 80;
    server_name localhost;

    # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    set $upstream_kong http://kong:8000;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API requests to Kong gateway
    location /auth/ {
        proxy_pass $upstream_kong/auth/;
        proxy_set_header Host $host;
    }

    location /timer/ {
        proxy_pass $upstream_kong/timer/;
        proxy_set_header Host $host;
    }

    location /game/ {
        proxy_pass $upstream_kong/game/;
        proxy_set_header Host $host;
    }

    location /documents/ {
        proxy_pass $upstream_kong/documents/;
        proxy_set_header Host $host;
    }

    location /query/ {
        proxy_pass $upstream_kong/query/;
        proxy_set_header Host $host;
    }

    location /api/leaderboard/ {
        proxy_pass $upstream_kong/api/leaderboard/;
        proxy_set_header Host $host;
    }

    location /analytics/ {
        proxy_pass $upstream_kong/analytics/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $upstream_kong/api/;
        proxy_set_header Host $host;
    }

    # WebSocket Support
    location /socket.io/ {
        proxy_pass $upstream_kong/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /ws/leaderboard/ {
        proxy_pass $upstream_kong/ws/leaderboard/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }


    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

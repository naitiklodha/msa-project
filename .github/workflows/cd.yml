name: CD - Deploy to ECS Fargate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      services:
        description: 'Comma-separated list of services to deploy (empty = all)'
        required: false
        default: ''
        type: string
      force_new_deployment:
        description: 'Force new deployment even if image tag unchanged'
        required: false
        default: false
        type: boolean

  # Auto-deploy on main branch after successful CI
  workflow_run:
    workflows: ["CI - Build, Test & Push to ECR"]
    types:
      - completed
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECS_CLUSTER: focuspulse-cluster

jobs:
  migrate-db:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      migration-status: ${{ steps.migrate.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsMigrate

      - name: Run DB migration via SSM tunnel
        id: migrate
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          BASTION_INSTANCE_ID: ${{ secrets.BASTION_INSTANCE_ID }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RDS_ENDPOINT" ] || [ -z "$BASTION_INSTANCE_ID" ]; then
            echo "::warning::RDS_ENDPOINT or BASTION_INSTANCE_ID not set — skipping migration"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Starting SSM tunnel to RDS..."
          # Start tunnel in background
          aws ssm start-session \
            --target "$BASTION_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "host=[\"$RDS_ENDPOINT\"],portNumber=[\"5432\"],localPortNumber=[\"5432\"]" \
            --region ${{ env.AWS_REGION }} &
          TUNNEL_PID=$!

          # Wait for tunnel to be ready
          sleep 5

          # Run migration
          echo "Running embedding dimension migration..."
          if psql "postgresql://focuspulse:$PGPASSWORD@localhost:5432/focuspulse" \
            -c "ALTER TABLE document_chunks ALTER COLUMN embedding TYPE VECTOR(768) USING embedding::VECTOR(768);" 2>&1; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Migration completed"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Migration failed"
            kill $TUNNEL_PID 2>/dev/null || true
            exit 1
          fi

          # Clean up tunnel
          kill $TUNNEL_PID 2>/dev/null || true

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: migrate-db
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsDeploy

      - name: Determine services to deploy
        id: services
        run: |
          # Default services list from docker-compose
          # Kong is now built by CI with custom Dockerfile (bakes kong.yml)
          ALL_SERVICES=(
            "auth-service"
            "game-service"
            "timer-service"
            "rag-service"
            "bff"
            "frontend"
            "leaderboard-service"
            "room-service"
            "notification-service"
            "analytics-service"
            "focuspulse-kong-service"
          )

          if [ -n "${{ github.event.inputs.services }}" ]; then
            # Use comma-separated list from workflow_dispatch input
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            echo "services=${SERVICES[*]}" >> $GITHUB_OUTPUT
          else
            # Deploy all services
            echo "services=${ALL_SERVICES[*]}" >> $GITHUB_OUTPUT
          fi

      - name: Get image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # For manual trigger, use latest or specific tag
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            # For auto-deploy from CI, use the git SHA
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy services
        run: |
          SERVICES=(${{ steps.services.outputs.services }})
          TAG=${{ steps.image-tag.outputs.tag }}
          FORCE=${{ github.event.inputs.force_new_deployment }}

          # Function to map service name to ECR repo name
          ecr_repo() {
            case "$1" in
              auth-service) echo "focuspulse-auth" ;;
              game-service) echo "focuspulse-game" ;;
              timer-service) echo "focuspulse-timer" ;;
              rag-service) echo "focuspulse-rag" ;;
              bff) echo "focuspulse-bff" ;;
              frontend) echo "focuspulse-frontend" ;;
              leaderboard-service) echo "focuspulse-leaderboard" ;;
              room-service) echo "focuspulse-room" ;;
              notification-service) echo "focuspulse-notification" ;;
              analytics-service) echo "focuspulse-analytics" ;;
              focuspulse-kong-service) echo "focuspulse-kong" ;;
              *) echo "focuspulse-$1" ;;
            esac
          }

          for SERVICE in "${SERVICES[@]}"; do
            echo "Deploying $SERVICE with tag $TAG..."

            # Get the current task definition ARN
            ECR_REPO=$(ecr_repo "$SERVICE")
            # Kong is not built by CI, use 'latest' tag instead of git SHA
            if [ "$SERVICE" = "focuspulse-kong-service" ]; then
              IMAGE="${{ env.ECR_REGISTRY }}/${ECR_REPO}:latest"
            else
              IMAGE="${{ env.ECR_REGISTRY }}/${ECR_REPO}:${TAG}"
            fi

            # Get current task definition
            CURRENT_TD=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services $SERVICE \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].taskDefinition' \
              --output text)

            echo "Current task definition: $CURRENT_TD"

            # Get task definition JSON
            TD_JSON=$(aws ecs describe-task-definition \
              --task-definition "$CURRENT_TD" \
              --region ${{ env.AWS_REGION }} \
              --output json)

            # Create new task definition with updated image + fixed config
            # Fix: REDIS_URL to rediss:// (Valkey Serverless requires in-transit TLS),
            # remove NODE_EXTRA_CA_CERTS (now baked into image)
            # Force GEMINI_EMBEDDING_MODEL to text-embedding-004 (768 dims) to match DB schema
            # For Kong: set AWS-optimized config (router flavor, rate-limiting policy)
            NEW_TD_JSON=$(echo "$TD_JSON" | jq --arg IMAGE "$IMAGE" '
              .taskDefinition
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
              | .containerDefinitions[] |= (
                  (if .image | contains("'${{ env.ECR_REGISTRY }}'") then .image = $IMAGE else . end)
                  | .environment |= map(
                      if .name=="REDIS_URL" then .value="rediss://focuspulse-cache-ji5gw7.serverless.aps1.cache.amazonaws.com:6379"
                      elif .name=="NODE_EXTRA_CA_CERTS" then empty
                      elif .name=="KONG_ROUTER_FLAVOR" then .value="traditional"
                      elif .name=="RATE_LIMIT_POLICY" then .value="local"
                      elif .name=="REDIS_HOST" then .value="focuspulse-cache-ji5gw7.serverless.aps1.cache.amazonaws.com"
                      elif .name=="GEMINI_EMBEDDING_MODEL" then .value="gemini-embedding-001"
                      else . end
                    )
                )
            ')

            # Register new task definition
            NEW_TD_ARN=$(echo "$NEW_TD_JSON" | aws ecs register-task-definition \
              --cli-input-json "$(cat)" \
              --region ${{ env.AWS_REGION }} \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "New task definition: $NEW_TD_ARN"

            # Update service to use new task definition
            FORCE_FLAG=""
            if [ "$FORCE" = "true" ]; then
              FORCE_FLAG="--force-new-deployment"
            fi

            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service $SERVICE \
              --task-definition "$NEW_TD_ARN" \
              $FORCE_FLAG \
              --region ${{ env.AWS_REGION }} \
              --output json | jq -r '.service.deployments[0].status'

            echo "✅ Deployed $SERVICE"
          done

      - name: Wait for deployments to stabilize
        run: |
          SERVICES=(${{ steps.services.outputs.services }})

          for SERVICE in "${SERVICES[@]}"; do
            echo "Waiting for $SERVICE to stabilize..."
            aws ecs wait services-stable \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services $SERVICE \
              --region ${{ env.AWS_REGION }}
            echo "✅ $SERVICE is stable"
          done

      - name: Verify deployment health
        run: |
          SERVICES=(${{ steps.services.outputs.services }})

          for SERVICE in "${SERVICES[@]}"; do
            echo "Checking health of $SERVICE..."

            # Get task ARNs for the service
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name $SERVICE \
              --desired-status RUNNING \
              --region ${{ env.AWS_REGION }} \
              --query 'taskArns[]' \
              --output text)

            if [ -n "$TASK_ARNS" ]; then
              # Describe tasks to get health status
              aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks $TASK_ARNS \
                --region ${{ env.AWS_REGION }} \
                --query 'tasks[].{service:group, lastStatus:lastStatus, healthStatus:healthStatus}' \
                --output table
            else
              echo "⚠️ No running tasks for $SERVICE"
            fi
          done

      - name: Run post-deployment smoke test
        run: |
          # Get ALB DNS name
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names focuspulse-alb \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "ALB DNS: $ALB_DNS"

          # Wait a bit for ALB to register new targets
          sleep 30

          # Run basic health checks
          echo "Running health checks..."
          curl -f "http://$ALB_DNS/healthz" || echo "Health check failed"
          curl -f "http://$ALB_DNS/api/healthz" || echo "API health check failed"

          echo "✅ Post-deployment verification complete"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # Could add SNS notification or Slack webhook here
          # aws sns publish --topic-arn ${{ secrets.SNS_ALERT_TOPIC }} --message "Deployment failed for ${{ github.repository }}"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsRollback

      - name: Rollback to previous task definition
        run: |
          SERVICES=(${{ needs.deploy.outputs.services }})  # This won't work directly, need to pass differently

          # For each service, get the previous task definition and rollback
          # This is a simplified rollback - in production you'd want more sophisticated logic
          echo "Rollback triggered. Manual intervention may be required."
          echo "Check ECS console for previous task definitions to rollback to."

  # Alternative: Deploy specific service
  deploy-single:
    name: Deploy Single Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.services != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsDeploySingle

      - name: Deploy single service
        run: |
          SERVICE="${{ github.event.inputs.services }}"
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          FORCE="${{ github.event.inputs.force_new_deployment }}"

          # Function to map service name to ECR repo name
          ecr_repo() {
            case "$1" in
              auth-service) echo "focuspulse-auth" ;;
              game-service) echo "focuspulse-game" ;;
              timer-service) echo "focuspulse-timer" ;;
              rag-service) echo "focuspulse-rag" ;;
              bff) echo "focuspulse-bff" ;;
              frontend) echo "focuspulse-frontend" ;;
              leaderboard-service) echo "focuspulse-leaderboard" ;;
              room-service) echo "focuspulse-room" ;;
              notification-service) echo "focuspulse-notification" ;;
              analytics-service) echo "focuspulse-analytics" ;;
              focuspulse-kong-service) echo "focuspulse-kong" ;;
              *) echo "focuspulse-$1" ;;
            esac
          }

          ECR_REPO=$(ecr_repo "$SERVICE")
          IMAGE="${{ env.ECR_REGISTRY }}/${ECR_REPO}:${TAG}"

          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG="--force-new-deployment"
          fi

          echo "Deploying $SERVICE with image $IMAGE"

          # Get current task definition
          CURRENT_TD=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services $SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current task definition: $CURRENT_TD"

          # Get task definition JSON
          TD_JSON=$(aws ecs describe-task-definition \
            --task-definition "$CURRENT_TD" \
            --region ${{ env.AWS_REGION }} \
            --output json)

          # Create new task definition with updated image + fixed config
          NEW_TD_JSON=$(echo "$TD_JSON" | jq --arg IMAGE "$IMAGE" '
            .taskDefinition
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[] |= (
                (if .image | contains("'${{ env.ECR_REGISTRY }}'") then .image = $IMAGE else . end)
                | .environment |= map(
                    if .name=="REDIS_URL" then .value="rediss://focuspulse-cache-ji5gw7.serverless.aps1.cache.amazonaws.com:6379"
                    elif .name=="NODE_EXTRA_CA_CERTS" then empty
                    elif .name=="KONG_ROUTER_FLAVOR" then .value="traditional"
                    elif .name=="RATE_LIMIT_POLICY" then .value="local"
                    elif .name=="REDIS_HOST" then .value="focuspulse-cache-ji5gw7.serverless.aps1.cache.amazonaws.com"
                    elif .name=="GEMINI_EMBEDDING_MODEL" then .value="gemini-embedding-001"
                    else . end
                  )
              )
          ')

          # Register new task definition
          NEW_TD_ARN=$(echo "$NEW_TD_JSON" | aws ecs register-task-definition \
            --cli-input-json "$(cat)" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition: $NEW_TD_ARN"

          # Update service to use new task definition
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service $SERVICE \
            --task-definition "$NEW_TD_ARN" \
            $FORCE_FLAG \
            --region ${{ env.AWS_REGION }}

          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services $SERVICE \
            --region ${{ env.AWS_REGION }}

          echo "✅ $SERVICE deployed and stable"
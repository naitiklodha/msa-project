name: msa-project
services:
  # --- Databases & Storage ---
  # The persistent stuff—Postgres for data, Redis for quick lookups, 
  # and Kafka to glue everything together.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: focuspulse
      POSTGRES_PASSWORD: changeme_pg
      POSTGRES_DB: focuspulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- API Gateway ---
  # The front door. Everything hits Kong first before getting routed 
  # to the internal services.
  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_DNS_RESOLVER: 127.0.0.11
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      auth-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
      timer-service:
        condition: service_healthy
      bff:
        condition: service_healthy

  # --- Core Services ---
  # The internal microservices that handle the actual business logic.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      PORT: 3001
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PG_CONNECTION_STRING: postgresql://focuspulse:changeme_pg@postgres:5432/focuspulse
      JWT_SECRET: changeme_jwt_secret_min_32_chars!!
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  game-service:
    build:
      context: .
      dockerfile: services/game-service/Dockerfile
    environment:
      SERVICE_NAME: game-service
      PORT: 3002
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PG_CONNECTION_STRING: postgresql://focuspulse:changeme_pg@postgres:5432/focuspulse
      JWT_SECRET: changeme_jwt_secret_min_32_chars!!
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  quiz-service:
    build:
      context: .
      dockerfile: services/quiz-service/Dockerfile
    environment:
      SERVICE_NAME: quiz-service
      PORT: 3003
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PG_CONNECTION_STRING: postgresql://focuspulse:changeme_pg@postgres:5432/focuspulse
      JWT_SECRET: changeme_jwt_secret_min_32_chars!!
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  timer-service:
    build:
      context: .
      dockerfile: services/timer-service/Dockerfile
    environment:
      SERVICE_NAME: timer-service
      PORT: 3004
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PG_CONNECTION_STRING: postgresql://focuspulse:changeme_pg@postgres:5432/focuspulse
      JWT_SECRET: changeme_jwt_secret_min_32_chars!!
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    environment:
      SERVICE_NAME: bff
      PORT: 3010
      AUTH_SERVICE_URL: http://auth-service:3001
      GAME_SERVICE_URL: http://game-service:3002
      QUIZ_SERVICE_URL: http://quiz-service:3003
      TIMER_SERVICE_URL: http://timer-service:3004
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PG_CONNECTION_STRING: postgresql://focuspulse:changeme_pg@postgres:5432/focuspulse
      JWT_SECRET: changeme_jwt_secret_min_32_chars!!
      NODE_ENV: production
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- Background Workers ---
  # These guys just sit in the background and chew through Kafka events.
  leaderboard-consumer:
    build:
      context: .
      dockerfile: consumers/leaderboard/Dockerfile
    environment:
      SERVICE_NAME: leaderboard-consumer
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PG_CONNECTION_STRING: postgresql://focuspulse:changeme_pg@postgres:5432/focuspulse
      JWT_SECRET: changeme_jwt_secret_min_32_chars!!
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  kafka-data:

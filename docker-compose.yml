name: msa-project
services:
  # --- Databases & Storage ---
  # The persistent stuff—Postgres for data, Redis for quick lookups, 
  # and Kafka to glue everything together.
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- API Gateway ---
  # The front door. Everything hits Kong first before getting routed 
  # to the internal services.
  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_DECLARATIVE_CONFIG: ${KONG_DECLARATIVE_CONFIG}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: ${KONG_ADMIN_LISTEN:-0.0.0.0:8001}
      KONG_DNS_RESOLVER: 127.0.0.11
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      auth-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
#      quiz-service:
#        condition: service_healthy
      timer-service:
        condition: service_healthy
      bff:
        condition: service_healthy

  # --- Core Services ---
  # The internal microservices that handle the actual business logic.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      PORT: ${AUTH_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTH_SERVICE_PORT}/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  game-service:
    build:
      context: .
      dockerfile: services/game-service/Dockerfile
    environment:
      SERVICE_NAME: game-service
      PORT: ${GAME_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GAME_SERVICE_PORT}/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

#  quiz-service:
#    build:
#      context: .
#      dockerfile: services/quiz-service/Dockerfile
#    environment:
#      SERVICE_NAME: quiz-service
#      PORT: ${QUIZ_SERVICE_PORT}
#      KAFKA_BROKERS: ${KAFKA_BROKERS}
#      REDIS_URL: ${REDIS_URL}
#      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
#      JWT_SECRET: ${JWT_SECRET}
#      NODE_ENV: production
#    depends_on:
#      kafka:
#        condition: service_healthy
#    healthcheck:
#      test: ["CMD-SHELL", "wget -qO- http://localhost:${QUIZ_SERVICE_PORT}/healthz || exit 1"]
#      interval: 5s
#      timeout: 3s
#      retries: 3

  timer-service:
    build:
      context: .
      dockerfile: services/timer-service/Dockerfile
    environment:
      SERVICE_NAME: timer-service
      PORT: ${TIMER_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${TIMER_SERVICE_PORT}/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.0-flash}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${RAG_SERVICE_PORT:-3011}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    environment:
      SERVICE_NAME: bff
      PORT: ${BFF_PORT}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT}
      GAME_SERVICE_URL: http://game-service:${GAME_SERVICE_PORT}
#      QUIZ_SERVICE_URL: http://quiz-service:${QUIZ_SERVICE_PORT}
      TIMER_SERVICE_URL: http://timer-service:${TIMER_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    ports:
      - "${BFF_PORT}:${BFF_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BFF_PORT}/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- Background Workers ---
  # These guys just sit in the background and chew through Kafka events.
  leaderboard-consumer:
    build:
      context: .
      dockerfile: consumers/leaderboard/Dockerfile
    environment:
      SERVICE_NAME: leaderboard-consumer
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  kafka-data:

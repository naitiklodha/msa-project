name: msa-project
services:
  # --- Databases & Storage ---
  # The persistent stuff—Postgres for data, Redis for quick lookups, 
  # and Kafka to glue everything together.
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- API Gateway ---
  # The front door. Everything hits Kong first before getting routed 
  # to the internal services.
  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_DECLARATIVE_CONFIG: ${KONG_DECLARATIVE_CONFIG}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: ${KONG_ADMIN_LISTEN:-0.0.0.0:8001}
      KONG_DNS_RESOLVER: 127.0.0.11
      CORS_ORIGINS: ${CORS_ORIGINS}
      KONG_CORS_ORIGIN: ${KONG_CORS_ORIGIN}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL}
      TIMER_SERVICE_URL: ${TIMER_SERVICE_URL}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
      BFF_SERVICE_URL: ${BFF_SERVICE_URL}
      LEADERBOARD_SERVICE_URL: ${LEADERBOARD_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      ROOM_SERVICE_URL: ${ROOM_SERVICE_URL}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL}
      FRONTEND_SERVICE_URL: ${FRONTEND_SERVICE_URL}
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      timer-service:
        condition: service_healthy
      bff:
        condition: service_healthy
      frontend:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      leaderboard-service:
        condition: service_healthy


  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8002:80"
    environment:
      KONG_UPSTREAM_URL: ${KONG_UPSTREAM_URL}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      rag-service:
        condition: service_healthy

  # --- Core Services ---
  # The internal microservices that handle the actual business logic.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      PORT: ${AUTH_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  game-service:
    build:
      context: .
      dockerfile: services/game-service/Dockerfile
    environment:
      SERVICE_NAME: game-service
      PORT: ${GAME_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  timer-service:
    build:
      context: .
      dockerfile: services/timer-service/Dockerfile
    environment:
      SERVICE_NAME: timer-service
      PORT: ${TIMER_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.0-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${RAG_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      PYTHONUNBUFFERED: 1

 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8080') + '/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    environment:
      SERVICE_NAME: bff
      PORT: ${BFF_PORT}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL}
#      QUIZ_SERVICE_URL: http://quiz-service:${QUIZ_SERVICE_PORT}
      TIMER_SERVICE_URL: ${TIMER_SERVICE_URL}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
      LEADERBOARD_SERVICE_URL: ${LEADERBOARD_SERVICE_URL}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    ports:
      - "${BFF_PORT}:${BFF_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  leaderboard-service:
    build:
      context: .
      dockerfile: services/leaderboard-service/Dockerfile
    environment:
      SERVICE_NAME: leaderboard-service
      PORT: ${LEADERBOARD_SERVICE_PORT}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  room-service:
    build:
      context: .
      dockerfile: services/room-service/Dockerfile
    environment:
      SERVICE_NAME: room-service
      PORT: ${ROOM_SERVICE_PORT}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SERVICE_NAME: notification-service
      PORT: ${NOTIFICATION_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 3

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    environment:
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      PORT: ${ANALYTICS_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Background Workers ---
  # These guys just sit in the background and chew through Kafka events.
  leaderboard-consumer:
    build:
      context: .
      dockerfile: consumers/leaderboard/Dockerfile
    environment:
      SERVICE_NAME: leaderboard-consumer
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_URL: ${REDIS_URL}
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      leaderboard-service:
        condition: service_healthy

volumes:
  kafka-data:

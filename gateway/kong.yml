_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - ${{KONG_CORS_ORIGIN}}
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      second: 200
      minute: 5000
      policy: redis
      redis_host: redis
      redis_port: 6379

services:
  - name: auth-service
    url: ${{AUTH_SERVICE_URL}}
    routes:
      - name: auth-route
        paths:
          - /auth

  - name: game-service
    url: ${{GAME_SERVICE_URL}}
    routes:
      - name: game-public
        paths:
          - /game/healthz
          - /game/metrics
      - name: game-protected
        paths:
          - /game
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: rag-service
    url: ${{RAG_SERVICE_URL}}
    routes:
      - name: rag-public
        paths:
          - /rag/
        strip_path: true

      - name: rag-protected
        paths:
          - /documents
          - /query
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: timer-service
    url: ${{TIMER_SERVICE_URL}}
    routes:
      - name: timer-public
        paths:
          - /timer/healthz
          - /timer/metrics
      - name: timer-protected
        paths:
          - /timer
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: quiz-service
    url: ${{RAG_SERVICE_URL}}/documents/quiz
    routes:
      - name: quiz-public
        paths:
          - /quiz/healthz
      - name: quiz-protected
        paths:
          - /quiz
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: frontend
    url: ${{FRONTEND_SERVICE_URL}}
    routes:
      - name: frontend-route
        paths:
          - /

  - name: bff
    url: ${{BFF_SERVICE_URL}}
    routes:
      - name: bff-public
        paths:
          - /api/healthz
          - /api/metrics
      - name: bff-dashboard
        paths:
          - /api/dashboard
        strip_path: false
      - name: bff-ws
        paths:
          - /socket.io
        protocols:
          - http
          - https
        strip_path: false
      - name: bff-protected
        paths:
          - /api
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: leaderboard-service
    url: ${{LEADERBOARD_SERVICE_URL}}
    routes:
      - name: leaderboard-public
        paths:
          - /api/leaderboard
        strip_path: true
      - name: leaderboard-ws
        paths:
          - /ws/leaderboard
        protocols:
          - http
          - https
        strip_path: false

  - name: notification-svc
    url: ${{NOTIFICATION_SERVICE_URL}}
    routes:
      - name: notification-protected
        paths:
          - /notifications
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: analytics-service
    url: ${{ANALYTICS_SERVICE_URL}}
    routes:
      - name: analytics-public
        paths:
          - /analytics/healthz
      - name: analytics-protected
        paths:
          - /analytics
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: room-service
    url: ${{ROOM_SERVICE_URL}}
    routes:
      - name: room-public
        paths:
          - /rooms/status
        strip_path: true
      - name: room-protected
        paths:
          - /rooms
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true
      - name: room-ws
        paths:
          - /ws/rooms
        protocols:
          - http
          - https
        strip_path: false

consumers:
  - username: focuspulse-app
    jwt_secrets:
      - key: focuspulse
        secret: b8e83891c8103c8e30ab72aa12321811462f8e1f4bbf32ced8e8a7d1050d3009

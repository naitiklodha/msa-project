_format_version: "3.0"
_transform: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      second: 200
      minute: 5000
      policy: redis
      redis_host: redis
      redis_port: 6379
    redis_timeout: 2000

services:
  - name: auth-service
    url: http://auth-service:3001
    routes:
      - name: auth-route
        paths:
          - /auth

  - name: game-service
    url: http://game-service:3002
    routes:
      - name: game-public
        paths:
          - /game/healthz
          - /game/metrics
      - name: game-protected
        paths:
          - /game
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: rag-service
    url: http://rag-service:8080
    routes:
      - name: rag-public
        paths:
          - /rag/healthz
          - /rag/metrics
      - name: rag-protected
        paths:
          - /documents
          - /query
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: timer-service
    url: http://timer-service:3004
    routes:
      - name: timer-public
        paths:
          - /timer/healthz
          - /timer/metrics
      - name: timer-protected
        paths:
          - /timer
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: frontend
    url: http://frontend:80
    routes:
      - name: frontend-route
        paths:
          - /

  - name: bff
    url: http://bff:3010
    routes:
      - name: bff-public
        paths:
          - /api/healthz
          - /api/metrics
      - name: bff-ws
        paths:
          - /socket.io
        protocols:
          - http
          - https
      - name: bff-protected
        paths:
          - /api
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: leaderboard-service
    url: http://leaderboard-service:3005
    routes:
      - name: leaderboard-ws
        paths:
          - /ws/leaderboard
        protocols:
          - http
          - https
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: notification-svc
    url: http://notification-svc:3007
    routes:
      - name: notification-protected
        paths:
          - /notifications
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true


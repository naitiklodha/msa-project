_format_version: "3.0"
_transform: true

# ──────────────────────────────────────────────────────────────────
# FocusPulse Kong Gateway - AWS ECS / Cloud Map edition
#
# All upstream URLs use Cloud Map service discovery:
#   http://<service-name>.focuspulse.local:<port>
#
# Rate limiting uses local policy (no Redis dependency in the gateway)
# DNS resolver: 169.254.169.253 (AWS Route 53 Resolver)
# ──────────────────────────────────────────────────────────────────

plugins:
  - name: cors
    config:
      origins:
        - $(env "KONG_CORS_ORIGIN")
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      second: 200
      minute: 5000
      policy: local

services:
  - name: auth-service
    url: $(env "AUTH_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: auth-route
        paths:
          - /auth

  - name: game-service
    url: $(env "GAME_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: game-public
        paths:
          - "~/game(?=/health/(?:live|ready)$)"
          - /game/metrics
      - name: game-protected
        paths:
          - /game
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: rag-service
    url: $(env "RAG_SERVICE_URL")
    connect_timeout: 10000
    read_timeout: 300000
    write_timeout: 300000
    routes:
      - name: rag-public
        paths:
          - /rag/
        strip_path: true

      - name: rag-protected
        paths:
          - /documents
          - /query
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: timer-service
    url: $(env "TIMER_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: timer-public
        paths:
          - "~/timer(?=/health/(?:live|ready)$)"
          - /timer/metrics
      - name: timer-protected
        paths:
          - /timer
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: quiz-service
    url: $(env "RAG_SERVICE_URL")
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: quiz-public
        paths:
          - /documents/quiz/healthz
      - name: quiz-protected
        paths:
          - /documents/quiz
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: bff
    url: $(env "BFF_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: bff-public
        paths:
          - "~/api(?=/health/(?:live|ready)$)"
          - /api/metrics
      - name: bff-dashboard
        paths:
          - /api/dashboard
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true
      - name: bff-ws
        paths:
          - /socket.io
        protocols:
          - http
          - https
        strip_path: false
      - name: bff-protected
        paths:
          - /api
        strip_path: false
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: leaderboard-service
    url: $(env "LEADERBOARD_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: leaderboard-public
        paths:
          - /api/leaderboard
        strip_path: true
      - name: leaderboard-ws
        paths:
          - /ws/leaderboard
        protocols:
          - http
          - https
        strip_path: false

  - name: notification-svc
    url: $(env "NOTIFICATION_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: notification-protected
        paths:
          - /notifications
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: analytics-service
    url: $(env "ANALYTICS_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: analytics-public
        paths:
          - "~/analytics(?=/health/(?:live|ready)$)"
      - name: analytics-protected
        paths:
          - /analytics
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true

  - name: room-service
    url: $(env "ROOM_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: room-public
        paths:
          - /rooms/status
        strip_path: true
      - name: room-protected
        paths:
          - /rooms
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              run_on_preflight: true
      - name: room-ws
        paths:
          - /ws/rooms
        protocols:
          - http
          - https
        strip_path: false

  - name: frontend
    url: $(env "FRONTEND_SERVICE_URL")
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: frontend-route
        paths:
          - /

consumers:
  - username: focuspulse-app
    jwt_secrets:
      - key: focuspulse
        secret: $(env "JWT_SECRET")